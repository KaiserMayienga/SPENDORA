<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Inventory | Spendora</title>

    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
          rel="stylesheet">
</head>
<body class="bg-light">

    <nav class="navbar navbar-dark bg-dark">
        <div class="container">
            <a class="navbar-brand fw-bold" href="index.html">SPENDORA</a>
            <div class="navbar-nav flex-row gap-3">
                <a class="nav-link" href="index.html">Home</a>
                <a class="nav-link" href="products.html">Products</a>
                <a class="nav-link" href="login.html">Login</a>
            </div>
        </div>
    </nav>

    <main class="container py-5">
        <h1 class="mb-2">Inventory Management</h1>
        <p class="text-secondary mb-4">

        </p>

        <div class="table-responsive">
            <table class="table table-striped table-bordered table-hover align-middle">
                <thead class="table-dark">

                        <th scope="col">Category</th>

                <tbody>
                    <tr>
                        <td>001</td>
                        <td>Everyday Sneaker</td>

                    </tr>
                    <tr>
                        <td>002</td>
                        <td>Classic Runner</td>
                        <td>Sports</td>

                    </tr>
                    <tr>
                        <td>003</td>
                        <td>Street Style Sneaker</td>
                        <td>Lifestyle</td>
                        <td>2,800</td>
                    </tr>
                </tbody>
            </table>
        </div>

        <a href="index.html" class="btn btn-primary mt-3">Back to Home</a>
    </main>

    <footer class="text-center text-secondary py-3">
        <p>&copy; Spendora</p>
