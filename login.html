<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Sign in to your Spendora account.">
    <title>Login | Spendora</title>

    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
          rel="stylesheet">
</head>
<body class="bg-light">

    <!-- Navigation -->
    <nav class="navbar navbar-expand-lg navbar-dark bg-dark">
        <div class="container">
            <a class="navbar-brand fw-bold" href="index.html">SPENDORA</a>

            <div class="navbar-nav ms-auto">
                <a class="nav-link" href="index.html">Home</a>
                <a class="nav-link" href="products.html">Products</a>
                <a class="nav-link" href="register.html">Register</a>
                <a class="nav-link active" aria-current="page" href="login.html">Login</a>
            </div>
        </div>
    </nav>

    <!-- Login Form -->
    <main class="container py-5">
        <div class="row justify-content-center">
            <div class="col-12 col-md-8 col-lg-5">

                <div class="card shadow border-0">
                    <div class="card-body p-4 p-md-5">

                        <h1 class="text-center mb-2">Welcome Back</h1>
                        <p class="text-center text-secondary mb-4">
                            Sign in to your Spendora account.
                        </p>

                        <form action="#" method="get">
                            <div class="mb-3">
                                <label for="email" class="form-label">
                                    Email address
                                </label>
                                <input type="email"
                                       class="form-control"
                                       id="email"
                                       name="email"
                                       placeholder="name@example.com"
                                       autocomplete="email"
                                       required>
                            </div>

                            <div class="mb-3">
                                <label for="password" class="form-label">
                                    Password
                                </label>
                                <input type="password"
                                       class="form-control"
                                       id="password"
                                       name="password"
                                       autocomplete="current-password"
                                       required>
                            </div>

                            <div class="form-check mb-4">
                                <input class="form-check-input"
                                       type="checkbox"
                                       id="remember"
                                       name="remember">
                                <label class="form-check-label" for="remember">
                                    Remember me
                                </label>
                            </div>

                            <button type="submit"
                                    class="btn btn-primary w-100">
                                Sign In
                            </button>
                        </form>

                        <p class="text-center mt-4 mb-0">
                            Don't have an account?
                            <a href="register.html">Register here</a>
                        </p>

                        <p class="text-center mt-3 mb-0">
                            <a href="index.html" class="text-decoration-none">
                                Back to Home
                            </a>
                        </p>

                    </div>
                </div>

            </div>
        </div>
    </main>

    <footer class="text-center text-secondary py-3">
        <p class="mb-0">&copy; Spendora</p>
    </footer>

</body>
</html>
